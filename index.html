<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Loader</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid #00f260;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="loading-message">
        <div class="loader"></div>
        <p>게임을 불러오는 중입니다...</p>
    </div>

    <script>
        async function loadGame() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetUrl = urlParams.get('l');

            if (!targetUrl) {
                document.getElementById('loading-message').innerHTML = '<p>게임 링크가 없습니다 (?l=...)</p>';
                return;
            }

            try {
                const response = await fetch(targetUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const htmlContent = await response.text();

                // 현재 페이지의 내용을 가져온 HTML로 덮어쓰기
                document.open();
                document.write(htmlContent);
                document.close();

            } catch (error) {
                console.error('게임 로드 실패:', error);
                document.getElementById('loading-message').innerHTML = `
                <p style="color: #ff5555;">게임을 불러오는데 실패했습니다.</p>
                <p>브라우저 보안(CORS) 문제일 수 있습니다.</p>
                <p>직접 링크: <a href="${targetUrl}" style="color: #00f260;">${targetUrl}</a></p>
                <p>오류 내용: ${error.message}</p>
            `;
            }
        }

        loadGame();
    </script>

</body>

</html>
